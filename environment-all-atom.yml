# Environment for the all-atom PhantomWalk demos and paper experiments
# (phantomwalk/all_atom, phantomwalk/examples/all_atom). The coarse-grained
# workflow keeps using environment.yml. FlowerMD comes from the all-atom
# PhantomWalk branch on joelaforet/flowerMD until it is merged upstream.
name: phantomwalk-all-atom
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.13
  - numpy >=2.0,<2.3
  - scipy
  - hoomd >=5.0,!=5.3.0
  - gsd >=3.0,<5
  - freud >=3.4
  - mbuild >=1.4
  - gmso >=0.17
  - foyer >=1.0
  - forcefield-utilities
  - grits >=0.6.0
  - cmeutils >=1.3
  - unyt
  - packmol
  - rdkit
  - openmm >=8.2
  - openff-toolkit-base >=0.18
  - openff-interchange-base >=0.5
  - openff-forcefields
  - openff-units
  - openff-nagl
  - openff-nagl-models
  - matplotlib
  - mdanalysis >=2.7
  - nglview >=3.1
  - ipywidgets >=8
  - pillow
  - jupyter
  - pytest
  - pip
  - pip:
      - "flowermd @ git+https://github.com/joelaforet/flowerMD@aa-dpd-v2/07-smeared-electrostatics"
